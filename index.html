<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F3F5F4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#131A1C" media="(prefers-color-scheme: dark)">
  <title>Action Plan</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%23D2232A'/%3E%3Ccircle cx='16' cy='16' r='6' fill='white'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap">
  <link rel="stylesheet" href="css/styles.css">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    try { const t = JSON.parse(localStorage.getItem('actionplan.v1.theme')); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <div class="app">
    <nav class="nav" data-i18n-aria="nav.main" aria-label="Main">
      <div class="brand">
        <!-- Knafelc trail blaze: the red-and-white marker on Slovenian hiking paths -->
        <svg class="blaze-mark" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="13"/><circle cx="16" cy="16" r="6"/></svg>
        <span data-i18n="app.name">Action Plan</span>
      </div>
      <div class="plan-switch"></div>
      <button class="nav-item" data-view="dashboard" data-i18n-title="nav.dashboard">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20h18M5 20l5-9 3 4 3-6 4 11"/></svg>
        <span data-i18n="nav.dashboard">Overview</span>
      </button>
      <button class="nav-item" data-view="goals" data-i18n-title="nav.goals">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 21V4M6 4h11l-2.5 3.5L17 11H6"/></svg>
        <span data-i18n="nav.goals">Goals</span>
      </button>
      <button class="nav-item" data-view="states" data-i18n-title="nav.states">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="10" r="3"/><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/></svg>
        <span data-i18n="nav.states">States</span>
      </button>
      <button class="nav-item nav-extra" data-view="graphs" data-i18n-title="nav.graphs">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4v16h16"/><path d="M7 15l4-5 3 3 5-6"/></svg>
        <span data-i18n="nav.graphs">Graphs</span>
      </button>
      <button class="nav-item" data-view="activities" data-i18n-title="nav.activities">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4" width="17" height="16" rx="2"/><path d="M8 12l2.5 2.5L16 9"/></svg>
        <span data-i18n="nav.activities">Activities</span>
      </button>
      <button class="nav-item nav-extra" data-view="timeline" data-i18n-title="nav.timeline">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h9M8 12h10M6 18h8"/><path d="M4 3v18" opacity=".5"/></svg>
        <span data-i18n="nav.timeline">Timeline</span>
      </button>
      <button class="nav-item nav-extra" data-view="map" data-i18n-title="nav.map">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="4.5" r="2"/><circle cx="5.5" cy="12" r="2"/><circle cx="18.5" cy="12" r="2"/><circle cx="12" cy="19.5" r="2"/><path d="M11 6.2l-4.3 4.2M13 6.2l4.3 4.2M6.7 13.6l4.3 4.2M17.3 13.6L13 17.8"/></svg>
        <span data-i18n="nav.map">Map</span>
      </button>
      <!-- Phones: graphs, timeline and map move into a menu behind this button, to keep the tab bar short. -->
      <button class="nav-item nav-more" id="navMore" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="navSheet">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5.5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="18.5" cy="12" r="1.3"/></svg>
        <span data-i18n="nav.more">More</span>
      </button>
      <div class="nav-sheet" id="navSheet" role="menu" hidden></div>
      <div class="nav-footer">
        <button class="nav-item nav-toggle" id="navToggle" type="button" aria-expanded="true">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4v16"/><path d="M17 7l-5 5 5 5"/></svg>
          <span data-i18n="nav.collapse">Collapse sidebar</span>
        </button>
      </div>
    </nav>

    <main class="main">
      <header class="topbar">
        <div class="title-block">
          <!-- On phones the sidebar's plan switcher is hidden, so the plan name above the title switches plans. -->
          <label class="plan-name">
            <span class="sr-only" data-i18n="plan.label">Action plan</span>
            <select id="planName" data-plan-select></select>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5"/></svg>
          </label>
          <h1 id="viewTitle"></h1>
        </div>
        <div class="topbar-actions">
          <button class="icon-btn sync-btn" id="syncBtn" type="button" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 18a4.5 4.5 0 0 1-.6-8.96A6 6 0 0 1 18 8.5a4 4 0 0 1-.5 9.5z"/></svg>
          </button>
          <button class="icon-btn" id="helpBtn" type="button" aria-pressed="false" data-i18n-aria="btn.help" data-i18n-title="btn.help" aria-label="Help mode">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M9.6 9.5a2.5 2.5 0 1 1 3.4 2.3c-.6.3-1 .8-1 1.5v.7"/><circle cx="12" cy="16.8" r=".4"/></svg>
          </button>
          <button class="icon-btn" id="settingsBtn" type="button" aria-haspopup="dialog" data-i18n-aria="settings.title" data-i18n-title="settings.title" aria-label="Settings">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
          </button>
          <button class="btn primary add-btn" id="addBtn"></button>
        </div>
      </header>
      <section id="view" class="view" aria-live="polite"></section>
    </main>
  </div>

  <dialog id="modal" class="modal">
    <form method="dialog" id="modalForm" novalidate>
      <header class="modal-head">
        <h2 id="modalTitle"></h2>
        <button type="button" class="icon-btn" data-close data-i18n-aria="btn.close" aria-label="Close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </header>
      <div id="modalBody" class="modal-body"></div>
      <footer class="modal-foot">
        <button type="button" class="btn danger" id="deleteBtn" data-i18n="btn.delete" hidden>Delete</button>
        <span class="spacer"></span>
        <button type="button" class="btn ghost" data-close data-i18n="btn.cancel">Cancel</button>
        <button type="submit" class="btn primary" id="saveBtn" data-i18n="btn.save">Save</button>
      </footer>
    </form>
  </dialog>

  <dialog id="settings" class="modal settings" aria-labelledby="settingsTitle">
    <header class="modal-head">
      <h2 id="settingsTitle" data-i18n="settings.title">Settings</h2>
      <button type="button" class="icon-btn" data-settings-close data-i18n-aria="btn.close" aria-label="Close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </header>
    <div class="modal-body">
      <section class="set-group">
        <h3 data-i18n="settings.plan">Plan</h3>
        <div class="plan-switch"></div>
      </section>
      <section class="set-group">
        <h3 data-i18n="settings.appearance">Appearance</h3>
        <div class="set-row"><span data-i18n="nav.language">Language</span><div class="lang-switch seg" role="group" data-i18n-aria="nav.language" aria-label="Language"></div></div>
        <div class="set-row"><span data-i18n="settings.theme">Theme</span><div class="seg" id="themeSeg" role="group" data-i18n-aria="settings.theme" aria-label="Theme"></div></div>
      </section>
      <section class="set-group">
        <h3 data-i18n="settings.display">Display</h3>
        <label class="set-row switch"><span data-i18n="btn.help">Help mode</span><input type="checkbox" data-setting="help"></label>
        <label class="set-row switch"><span data-i18n="acts.hideDone">Hide done activities</span><input type="checkbox" data-setting="hideDone"></label>
        <label class="set-row switch"><span data-i18n="settings.tlDeps">Show dependencies on the timeline</span><input type="checkbox" data-setting="tlDeps"></label>
        <label class="set-row switch desktop-only"><span data-i18n="settings.navCollapsed">Collapsed sidebar</span><input type="checkbox" data-setting="navCollapsed"></label>
      </section>
      <section class="set-group" id="syncSection">
        <h3 data-i18n="sync.title">Sync</h3>
        <div class="sync-body"></div>
      </section>
      <section class="set-group">
        <h3 data-i18n="settings.data">Data</h3>
        <p class="hint" data-i18n="settings.dataHint">Your plans are stored only in this browser. Export a plan to back it up; importing a file always adds it as a new plan.</p>
        <div class="set-actions">
          <button type="button" class="btn small" id="exportBtn" data-i18n="btn.export">Export JSON</button>
          <label class="btn small"><span data-i18n="btn.import">Import JSON</span><input type="file" id="importInput" accept="application/json" hidden></label>
          <button type="button" class="btn small" id="sampleBtn" data-i18n="btn.sample">Load sample plan</button>
        </div>
      </section>
      <section class="set-group">
        <h3 data-i18n="settings.helpTitle">Help</h3>
        <div class="set-actions"><button type="button" class="btn small" id="tutorialBtn" data-i18n="btn.tutorial">Take the tour</button></div>
      </section>
    </div>
  </dialog>

  <div id="ctxMenu" class="ctx-menu" role="menu" hidden></div>
  <div id="toast" class="toast" role="status"></div>

  <script src="js/i18n.js"></script>
  <script src="js/config.js"></script>
  <script src="js/tutorial.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/drive.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
