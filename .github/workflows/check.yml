name: check
on:
  push:
    branches-ignore: [main] # on main, deploy.yml runs this workflow before it publishes
  pull_request:
  workflow_call:

jobs:
  check:
    # Pinned: ubuntu-latest moves to 26.04 in November 2026; 24.04 ships Google Chrome.
    runs-on: ubuntu-24.04
    env:
      TZ: Europe/Ljubljana
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci
      # Playwright (npm run test:e2e): Chromium's headless shell only, with its system libraries.
      - run: npx playwright install --with-deps --only-shell chromium
      # The upgrade test serves the app as it was before the restructure.
      - run: git fetch --no-tags --depth=1 origin +refs/tags/pre-restructure:refs/tags/pre-restructure
      - run: npm run check
