name: check
on:
  push:
  pull_request:

jobs:
  check:
    # Pinned: ubuntu-latest moves to 26.04 in November 2026; 24.04 ships Google Chrome.
    runs-on: ubuntu-24.04
    env:
      TZ: Europe/Ljubljana
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci
      - run: npm run check
