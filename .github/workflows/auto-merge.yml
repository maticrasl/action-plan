name: auto-merge
# The owner's pull requests merge themselves once "check" passes on them, and the merge is deployed.
# A draft pull request is left alone. A merge made with this workflow's token starts no other
# workflow (GitHub's rule), so this one starts deploy itself; workflow_dispatch is the exception.
on:
  workflow_run:
    workflows: [check]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  merge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.actor.login == github.repository_owner
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SHA: ${{ github.event.workflow_run.head_sha }}
      BRANCH: ${{ github.event.workflow_run.head_branch }}
    steps:
      - name: Merge the pull request whose commit passed, then deploy
        run: |
          pr=$(gh pr list --head "$BRANCH" --state open --json number,headRefOid,isDraft \
            --jq ".[] | select(.headRefOid == \"$SHA\" and (.isDraft | not)) | .number")
          if [ -z "$pr" ]; then echo "No open, ready pull request at $SHA."; exit 0; fi
          # Only the commit that passed: a newer push waits for its own check.
          gh pr merge "$pr" --squash --delete-branch --match-head-commit "$SHA"
          gh workflow run deploy.yml --ref main
